<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — GitВГТУ</title>
    <meta name="color-scheme" content="dark">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>

    <header class="topbar">
        <a class="brand" href="/">GitВГТУ</a>

        <nav class="nav" aria-label="Основная навигация">
            <a class="btn btn-ghost" href="/auth/login" aria-current="page">Войти</a>
            <a class="btn btn-solid" href="/auth/register">Регистрация</a>
        </nav>
    </header>

    <main class="auth">
        <section class="auth-panel" aria-labelledby="title">
            <h1 id="title">Вход</h1>
            <p class="auth-lead">Войдите, чтобы открыть свои репозитории.</p>

            <!-- Сюда JS (auth.js) подставит ошибку из адреса, например /auth/login?error=credentials -->
            <p id="form-error" class="form-error" role="alert" hidden></p>

            <form id="login-form" action="/auth/login" method="post">

                <div class="field">
                    <label for="email">Электронная почта</label>
                    <input id="email" name="email" type="email"
                           autocomplete="email" required autofocus>
                </div>

                <div class="field">
                    <label for="password">Пароль</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" required>
                </div>

                <button class="btn btn-solid btn-lg btn-block" type="submit">Войти</button>
            </form>

            <p class="auth-switch">Нет аккаунта? <a href="/auth/register">Регистрация</a></p>
        </section>
    </main>

    <script src="/js/auth.js">
        
    </script>
</body>
</html>
