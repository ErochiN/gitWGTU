<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — GitВГТУ</title>
    <meta name="color-scheme" content="dark">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>

    <header class="topbar">
        <a class="brand" href="/">GitВГТУ</a>

        <nav class="nav" aria-label="Основная навигация">
            <a class="btn btn-ghost" href="/auth/login">Войти</a>
            <a class="btn btn-solid" href="/auth/register" aria-current="page">Регистрация</a>
        </nav>
    </header>

    <main class="auth">
        <section class="auth-panel" aria-labelledby="title">
            <h1 id="title">Регистрация</h1>
            <p class="auth-lead">Создайте аккаунт, чтобы открыть свои репозитории.</p>

            <!-- Сюда JS (auth.js) подставит ошибку из адреса, например /auth/register?error=exists -->
            <p id="form-error" class="form-error" role="alert" hidden></p>

            <!-- action и method: форма уходит POST-запросом на /auth/register -->
            <form action="/auth/register" method="post">

                <div class="field">
                    <label for="firstName">Имя</label>
                    <input id="firstName" name="firstName" type="text"
                           autocomplete="given-name" maxlength="50" required autofocus>
                </div>

                <div class="field">
                    <label for="lastName">Фамилия</label>
                    <input id="lastName" name="lastName" type="text"
                           autocomplete="family-name" maxlength="50" required>
                </div>

                <div class="field">
                    <label for="group">Группа</label>
                    <input id="group" name="group" type="text"
                           maxlength="20" required
                           aria-describedby="group-hint">
                    <p id="group-hint" class="hint">Например, ПИ-211.</p>
                </div>

                <div class="field">
                    <label for="email">Электронная почта</label>
                    <input id="email" name="email" type="email"
                           autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Пароль</label>
                    <input id="password" name="password" type="password"
                           autocomplete="new-password" minlength="8" required
                           aria-describedby="password-hint">
                    <p id="password-hint" class="hint">Не короче 8 символов.</p>
                </div>

                <div class="field">
                    <label for="confirmPassword">Повторите пароль</label>
                    <input id="confirmPassword" name="confirmPassword" type="password"
                           autocomplete="new-password" minlength="8" required>
                </div>

                <button class="btn btn-solid btn-lg btn-block" type="submit">Создать аккаунт</button>
            </form>

            <p class="auth-switch">Уже есть аккаунт? <a href="/auth/login">Войти</a></p>
        </section>
    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
