<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль — GitВГТУ</title>
    <meta name="color-scheme" content="dark">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>

    <header class="topbar">
        <a class="brand" href="/">GitВГТУ</a>

        <nav class="nav" aria-label="Основная навигация">
            <!-- Обычные ссылки на отдельные страницы. Адреса можно менять под свои маршруты -->
            <a class="btn btn-ghost" href="/repos">Мои репозитории</a>
            <a class="btn btn-ghost" href="/search">Поиск</a>
            <button class="btn btn-ghost" id="logout-btn" type="button">Выйти</button>
        </nav>
    </header>

    <main class="auth">
        <section class="auth-panel profile" aria-labelledby="user-name">

            <!-- Круг с инициалами, JS заполнит его буквами -->
            <div class="avatar" id="user-avatar" aria-hidden="true"></div>

            <h1 id="user-name">Загрузка...</h1>

            <dl class="details">
                <div>
                    <dt>Почта</dt>
                    <dd id="user-email">—</dd>
                </div>
                <div>
                    <dt>Группа</dt>
                    <dd id="user-group">—</dd>
                </div>
            </dl>
        </section>
    </main>

    <script>
        async function loadProfile() {
            const response = await fetch("/api/profile");

            // Не авторизован: отправляем на страницу входа
            if (response.status === 401) {
                window.location.href = "/auth/login";
                return;
            }

            if (!response.ok) {
                document.getElementById("user-name").textContent =
                    "Не удалось загрузить профиль";
                return;
            }

            const user = await response.json();

            document.getElementById("user-name").textContent =
                `${user.firstName} ${user.lastName}`;

            document.getElementById("user-email").textContent =
                user.email;

            document.getElementById("user-group").textContent =
                user.group;

            // Инициалы для круга: первые буквы имени и фамилии
            document.getElementById("user-avatar").textContent =
                (user.firstName[0] + user.lastName[0]).toUpperCase();
        }

        // Выход: cookie с флагом HttpOnly из JS удалить нельзя, поэтому просим сервер
        document.getElementById("logout-btn").addEventListener("click", async () => {
            await fetch("/auth/logout", { method: "POST" });
            window.location.href = "/auth/login";
        });

        loadProfile();
    </script>
</body>
</html>
